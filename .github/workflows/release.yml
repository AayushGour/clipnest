name: Release

# Auto-releases on every push to `main`. Reads MARKETING_VERSION from
# ClipnestApp/project.yml; if no `v<version>` tag exists yet, it builds
# Clipnest, publishes a GitHub Release with a .dmg, AND creates the tag on
# that commit. Bump MARKETING_VERSION in ClipnestApp/project.yml and push —
# that's the whole release ritual. No manual `git tag` needed.
#
# Distribution is curl-only (scripts/install.sh / scripts/update.sh pull the
# .dmg straight off the GitHub Release). There is deliberately no Homebrew
# cask to keep in sync.
#
# Why not a separate tag-push trigger? A tag pushed by GITHUB_TOKEN does NOT
# re-trigger `on: push: tags` workflows, so we tag + release in one run instead.
#
# Signing/notarization is OPTIONAL: if the Developer ID secrets below are set,
# the .dmg is signed + notarized (Gatekeeper-clean). If not, it still builds
# and releases an UNSIGNED .dmg — usable, but users must right-click → Open on
# first launch (or run `xattr -dr com.apple.quarantine /Applications/Clipnest.app`).
#
# To enable signing, add these repo secrets (Settings → Secrets → Actions):
#   MACOS_CERTIFICATE_P12_BASE64  – base64 of your "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD    – the .p12 export password
#   CODESIGN_IDENTITY             – e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD – for notarytool

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the Release + tag

jobs:
  # Cheap gate: figure out the version and whether it's already been released.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version + check for existing tag
        id: v
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^\s*MARKETING_VERSION:' ClipnestApp/project.yml \
            | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read MARKETING_VERSION from ClipnestApp/project.yml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version v${VERSION} not released yet — will build + tag."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    # macOS 26 runner ships Xcode 26.x. Required: on the older macos-14 image
    # (Xcode 16.2), SwiftData crashes under `swift test` with "Unable to
    # determine Bundle Name" — a SwiftPM test bundle has no named `Bundle.main`,
    # and Xcode 16's SwiftData can't derive a store name without it. There is no
    # reliable code-level workaround for a hostless package test target; Xcode 26
    # doesn't have the bug. (macos-14 is also being deprecated by GitHub.)
    runs-on: macos-26
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # `secrets` can't be referenced in a step `if:`, but it CAN in job env.
      # Hoist the presence check here, then test env.HAS_SIGNING in the step.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      # Notarization is INDEPENDENT of signing. The release key from
      # scripts/release-cert.sh is self-signed, not a Developer ID, so it can
      # sign but can never notarize — and signing alone is what makes the
      # designated requirement stable across updates (which is what keeps
      # users' Accessibility grants alive). Gated separately so a missing
      # Apple Developer account doesn't skip signing too.
      HAS_NOTARY: ${{ secrets.NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'   # resolves to Xcode 26.6 on macos-26

      - name: Lint (swift-format, strict)
        # Gate: zero lint errors on Core, Tests, and the App target before we
        # build or ship. swift-format ships with the Xcode toolchain — no install.
        run: |
          swift format lint --recursive --strict Sources Tests
          swift format lint --recursive --strict ClipnestApp/Sources

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Run core tests
        run: swift test

      - name: Build app
        env:
          # If set, project.yml's Release config uses it for a developer-id export.
          DEVELOPMENT_TEAM: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/build.sh

      - name: Sign (and notarize, if Developer ID secrets are present)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          HAS_NOTARY: ${{ env.HAS_NOTARY }}
        run: |
          set -euo pipefail
          # Import the signing cert into a temporary keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          scripts/sign.sh "$CODESIGN_IDENTITY"

          if [ "${HAS_NOTARY}" = "true" ]; then
            # Notary keychain profile for scripts/notarize.sh.
            xcrun notarytool store-credentials clipnest-notary \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" \
              --keychain "$KEYCHAIN"
            scripts/notarize.sh clipnest-notary
          else
            echo "No notarization secrets — signed but not notarized."
            echo "The signature is what matters here: it pins the designated"
            echo "requirement to the release certificate instead of this build's"
            echo "cdhash, so users' Accessibility grants survive the update."
          fi

          echo "Designated requirement of the signed app:"
          codesign -d -r- build/Clipnest.app 2>&1 | grep -i designated || true

      - name: Package DMG
        run: scripts/package_dmg.sh

      - name: Name the DMG with the version
        id: dmg
        run: |
          OUT="build/Clipnest-${VERSION}.dmg"
          mv build/Clipnest.dmg "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$OUT" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (creates tag v$VERSION on this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "${{ steps.dmg.outputs.path }}" \
            --title "Clipnest v${VERSION}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes "**SHA-256:** \`${{ steps.dmg.outputs.sha256 }}\`"
