name: ClipnestApp
options:
  bundleIdPrefix: com.clipnest
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClipnestCore:
    path: ..
  # Sindre Sorhus, MIT — the one approved third-party dependency for
  # ClipnestApp per coding-standards.md's Dependency policy. Used only for
  # global-hotkey registration (plan task T27) + a future Settings recorder
  # (T28). Pinned to the latest stable *major* verified at implementation
  # time (2026-08-06) via `git ls-remote --tags` + the GitHub releases API
  # (an initial `git ls-remote | sort -V | tail` mis-sorted "v1.x" tags
  # ahead of the unprefixed "3.x" tags the project switched to after 1.17.0
  # — re-verified against the full, unfiltered tag list before pinning; see
  # project-context.md D11 for the full trail).
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.1
targets:
  ClipnestApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      # Resources (Assets.xcassets — AppIcon + MenuBarIcon) must live under
      # `sources`, NOT a `resources:` key: XcodeGen has no target-level
      # `resources` key, so the old `resources:` block was silently ignored
      # and the asset catalog never compiled (no Assets.car → no app/menu-bar
      # icon). XcodeGen auto-assigns .xcassets to the asset-compile phase and
      # leaves the .entitlements file (referenced via CODE_SIGN_ENTITLEMENTS)
      # out of any build phase.
      - path: Resources
    dependencies:
      - package: ClipnestCore
        product: ClipnestCore
      # Phase 3 (Linux port), P5: the platform-neutral view-model layer
      # (PickerViewModel, SettingsStore, OCRBackfillViewModel, UpdateChecker,
      # and their pure supporting types), extracted so the future Linux GTK
      # app can reuse it. Same local `ClipnestCore` package (`path: ..`
      # above) — `ClipnestViewModels` is one of its products.
      - package: ClipnestCore
        product: ClipnestViewModels
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Clipnest
        PRODUCT_BUNDLE_IDENTIFIER: com.clipnest.app
        MARKETING_VERSION: "0.9.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/ClipnestApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release-only signing settings for the Developer ID distribution
        # build (plan T36). Values are parameterized via XcodeGen's ${VAR}
        # environment-variable expansion (expanded at `xcodegen generate`
        # time from the shell) and are NEVER hardcoded here — if the env
        # var is unset, XcodeGen substitutes an empty string, which is fine:
        # scripts/build.sh's archive step always overrides with
        # CODE_SIGNING_ALLOWED=NO/CODE_SIGNING_REQUIRED=NO so an unset
        # value never blocks a build. Set DEVELOPMENT_TEAM (Apple Developer
        # Team ID) and CODE_SIGN_IDENTITY (e.g. "Developer ID Application")
        # in your own shell/CI environment before `xcodegen generate` to
        # produce a Release build pre-configured for real Developer ID
        # signing. The actual signing step itself lives in scripts/sign.sh,
        # which takes the full identity string as an argument/env var of
        # its own — never sourced from this file.
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
          CODE_SIGN_IDENTITY: ${CODE_SIGN_IDENTITY}
  # Unit test target for `ClipnestApp`'s own App-layer code (the architecture
  # + implementation reviews flagged the App target as having ZERO automated
  # tests — see project-context.md). Swift Testing, not XCTest, matching
  # coding-standards.md's test-framework rule for the whole repo. Also
  # depends on `ClipnestCore` directly so tests can construct
  # `InMemoryClipStore`/`InMemorySnippetStore` fakes without an intermediate
  # App-layer type.
  ClipnestAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ClipnestAppTests
    dependencies:
      - target: ClipnestApp
      - package: ClipnestCore
        product: ClipnestCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipnest.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        # XcodeGen's own `- target: ClipnestApp` dependency auto-configures
        # TEST_HOST/BUNDLE_LOADER (hosted-in-app unit testing) — but it
        # derives the host binary's path from the *target* name
        # ("ClipnestApp"), not its actual `PRODUCT_NAME` ("Clipnest", set
        # above on the `ClipnestApp` target) — the two diverged the moment
        # `PRODUCT_NAME` was overridden, so the auto-derived path pointed at
        # a `ClipnestApp.app` that's never actually produced (the real
        # product is `Clipnest.app`), and `xcodebuild test` failed with
        # "Could not find test host." Set explicitly here instead, matching
        # `PRODUCT_NAME: Clipnest` above — this literal must stay in sync
        # with that setting if it's ever renamed again.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clipnest.app/Contents/MacOS/Clipnest"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ClipnestApp:
    build:
      targets:
        ClipnestApp: all
        ClipnestAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipnestAppTests
      # T-PF8 (P0 safety fix): `ClipnestAppTests` is a *hosted* unit-test
      # target — `TEST_HOST` above points at the built `Clipnest.app`, so
      # `xcodebuild test` genuinely LAUNCHES the production app binary as the
      # process under test (`AppDelegate.applicationDidFinishLaunching` runs
      # for real). Without this override, that meant every test run opened,
      # migrated, and wrote the user's real, live clipboard database at
      # `~/Library/Application Support/Clipnest` — with no rollback if a
      # migration went wrong. `CLIPNEST_TEST_DATA_ROOT` (read in exactly one
      # place, `BlobStore.defaultBaseDirectory()` — see that method's doc
      # comment) redirects `AppEnvironment`'s `BlobStore` AND both SwiftData
      # stores' production containers to this throwaway directory instead.
      #
      # For a *hosted* unit-test target (unlike a UI-test target, which runs
      # a separate "test runner" app that launches the app-under-test as its
      # own child process) there is no separate process to lose this
      # variable across: the host app IS the one process xcodebuild launches
      # to run the injected test bundle, so a Test-action environment
      # variable set here is inherited by it directly, the same as any
      # process inherits variables set on it at launch. Verified empirically
      # for this fix — see the T-PF8 handoff for the before/after
      # `ClipItems.store` mtime proof.
      #
      # A fixed literal path (not a `$(...)`-expanded one) deliberately, to
      # keep this independent of Xcode's scheme-variable-expansion behavior —
      # the one thing this fix actually depends on is env-var propagation to
      # the host process, not string interpolation. `/tmp` is always
      # writable and is never the real `~/Library/Application Support`
      # family of paths, so this can never resolve back to production
      # regardless. The directory is intentionally NOT cleaned up between
      # runs (a reused throwaway SwiftData store is still fully isolated;
      # this is not a "fresh fixture per run" requirement).
      environmentVariables:
        CLIPNEST_TEST_DATA_ROOT: "/tmp/clipnest-test-data-root"
